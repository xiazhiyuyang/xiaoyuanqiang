# Alembic 配置（校园墙）
#
# 用法：
#   cd backend
#   venv/bin/alembic upgrade head          # 升级到最新结构
#   venv/bin/alembic current               # 查看当前版本
#   venv/bin/alembic revision --autogenerate -m "说明"   # 生成新迁移
#
# 数据库地址不写在这里，由 alembic/env.py 从 app.config.settings.DATABASE_URL 读取，
# 避免出现「.env 与 alembic.ini 两个地址不一致」这类经典事故。

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
