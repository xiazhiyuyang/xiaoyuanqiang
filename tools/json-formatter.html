<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JSON 格式化</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f5f7fa;color:#333;padding:16px}.c{max-width:900px;margin:0 auto}h1{font-size:20px;font-weight:700;margin-bottom:14px}.tb{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}button{padding:8px 16px;border:1px solid #ddd;border-radius:8px;background:#fff;cursor:pointer;font-size:13px}button:hover{border-color:#6366f1;color:#6366f1}button.p{background:#6366f1;color:#fff;border-color:#6366f1}textarea{width:100%;min-height:340px;padding:12px;border:1px solid #ddd;border-radius:10px;font-family:monospace;font-size:13px;line-height:1.6;resize:vertical;outline:none}textarea:focus{border-color:#6366f1}.st{margin-top:10px;font-size:13px;padding:8px 12px;border-radius:8px;display:none}.st.ok{display:block;background:#dcfce7;color:#166534}.st.err{display:block;background:#fee2e2;color:#991b1b}</style>
</head><body><div class="c"><h1>JSON 格式化工具</h1>
<div class="tb"><button class="p" onclick="fmt()">格式化</button><button onclick="min()">压缩</button><button onclick="chk()">校验</button><button onclick="cp()">复制</button><button onclick="clr()">清空</button></div>
<textarea id="in" placeholder='在此粘贴 JSON'></textarea>
<div id="st" class="st"></div></div>
<script>const inp=document.getElementById('in'),st=document.getElementById('st');
function show(m,ok){st.textContent=m;st.className='st '+(ok?'ok':'err')}
function get(){try{return JSON.parse(inp.value)}catch(e){show('解析失败：'+e.message,false);return null}}
function fmt(){const o=get();if(o===null)return;inp.value=JSON.stringify(o,null,2);show('格式化完成',true)}
function min(){const o=get();if(o===null)return;inp.value=JSON.stringify(o);show('压缩完成',true)}
function chk(){const o=get();if(o===null)return;show('格式正确',true)}
function cp(){navigator.clipboard.writeText(inp.value).then(()=>show('已复制',true))}
function clr(){inp.value='';st.style.display='none'}</script></body></html>
